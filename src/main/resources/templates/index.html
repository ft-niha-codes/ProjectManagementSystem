
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Task Management System</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #eaf1ff, #f7f9ff, #dce8ff);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            background: white;
            padding: 55px 35px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(24,49,83,.12);
        }

        h1 {
            color: #15366b;
            font-size: clamp(28px, 5vw, 42px);
            margin-bottom: 15px;
        }

        p {
            color: #60718b;
            line-height: 1.7;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
        }

        a {
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 9px;
            font-weight: bold;
        }

        .login {
            background: #183153;
            color: white;
        }

        .register {
            background: #eaf1ff;
            color: #183153;
        }

        a:hover { opacity: .85; }
    </style>
</head>

<body>
<div class="container">
    <h1>Project Task Management System</h1>

    <p>
        Organize projects, manage tasks, track progress
        and work together efficiently.
    </p>

    <div class="buttons">
        <a class="login" href="/login">LOGIN</a>
        <a class="register" href="/register-admin">REGISTER NEW ADMIN</a>
    </div>
</div>
</body>
</html>
