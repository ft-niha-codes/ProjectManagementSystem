<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projects - Project Task Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
        }

        .navbar {
            background-color: #172554;
            color: white;
            padding: 18px 35px;
        }

        .navbar h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            padding: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h2 {
            color: #172554;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            background-color: #172554;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1e3a8a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #172554;
            color: white;
        }

        .navbar {
            background-color: #172554;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="navbar">

    <h1>Project Task Management System</h1>

    <div class="nav-links">

        <a href="/">Dashboard</a>
        <a href="/projects">Projects</a>
        <a href="/tasks">Tasks</a>
        <a href="/team">Team Members</a>

    </div>

</div>

<div class="container">

    <div class="box">
        <h2>Create New Project</h2>

        <form action="/projects/save" method="post">

            <label>Project Name</label>
            <input type="text" name="name" placeholder="Enter project name" required>

            <label>Description</label>
            <textarea name="description"
                      placeholder="Enter project description"></textarea>

            <label>Status</label>
            <select name="status">
                <option value="Not Started">Not Started</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>

            <button type="submit">Save Project</button>

        </form>
    </div>

    <div class="box">
        <h2>Projects</h2>

        <input type="text"
               id="projectSearch"
               placeholder="Search projects..."
               onkeyup="searchProjects()"
               style="width:100%; padding:12px; margin-bottom:15px; box-sizing:border-box;">

        <table>
            <tr>
                <th>ID</th>
                <th>Project Name</th>
                <th>Description</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

            <tr th:each="project : ${projects}">
                <td th:text="${project.id}"></td>
                <td th:text="${project.name}"></td>
                <td th:text="${project.description}"></td>
                <td th:text="${project.status}"></td>
                <td>
                    <a th:href="@{'/projects/edit/' + ${project.id}}">
                        Edit
                    </a>
                </td>
                <td>
                    <a th:href="@{/projects/delete/{id}(id=${project.id})}"
                       onclick="return confirm('Are you sure you want to delete this project?')">
                        Delete
                    </a>
                </td>
            </tr>

        </table>
    </div>

</div>

<script>

    function searchProjects() {

        let input = document.getElementById("projectSearch");
        let filter = input.value.toLowerCase();

        let rows = document.querySelectorAll("table tr");

        for (let i = 1; i < rows.length; i++) {

            let projectName = rows[i]
                .getElementsByTagName("td")[1];

            if (projectName) {

                let text = projectName.textContent.toLowerCase();

                if (text.includes(filter)) {
                    rows[i].style.display = "";
                } else {
                    rows[i].style.display = "none";
                }
            }
        }
    }

</script>

</body>
</html>
